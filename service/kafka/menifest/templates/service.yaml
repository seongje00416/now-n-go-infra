# ── Headless Service (StatefulSet Pod DNS 등록용) ─────────────────────────────
# kafka-0.kafka-headless.{namespace}.svc.cluster.local 형태로 각 Pod에 접근 가능
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kafka.headlessService" . }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "kafka.selectorLabels" . | nindent 4 }}
  ports:
    - name: broker
      port: 9092
    - name: controller
      port: 9093

---
# ── ClusterIP Service (클러스터 내부 클라이언트 접근용) ──────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kafka.name" . }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "kafka.selectorLabels" . | nindent 4 }}
  ports:
    - name: broker
      port: {{ .Values.service.port }}
      targetPort: 9092