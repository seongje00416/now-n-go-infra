apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "kafka.name" . }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "kafka.headlessService" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kafka.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kafka.selectorLabels" . | nindent 8 }}
    spec:
      # ── Init Container: Pod 순번 → KAFKA_NODE_ID, FQDN 주입 ─────────────────
      initContainers:
        - name: init-kafka-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              # Pod 이름(예: kafka-0)에서 순번 추출
              POD_INDEX=${HOSTNAME##*-}
              echo "export KAFKA_NODE_ID=${POD_INDEX}" > /mnt/env/kafka.env
              echo "export KAFKA_POD_FQDN=${HOSTNAME}.{{ include "kafka.headlessService" . }}.{{ .Release.Namespace }}.svc.cluster.local" >> /mnt/env/kafka.env
              cat /mnt/env/kafka.env
          volumeMounts:
            - name: kafka-env
              mountPath: /mnt/env

      # ── Main Container ───────────────────────────────────────────────────────
      containers:
        - name: kafka
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              # init container가 생성한 환경변수 로드 (sh 호환: source 대신 .)
              . /mnt/env/kafka.env
              export KAFKA_NODE_ID KAFKA_POD_FQDN
              exec /usr/local/bin/docker-entrypoint.sh
          env:
            - name: KAFKA_CLUSTER_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafka.clusterIdSecret }}
                  key: KAFKA_CLUSTER_ID
          ports:
            - name: broker
              containerPort: 9092
            - name: controller
              containerPort: 9093
          volumeMounts:
            - name: kafka-env
              mountPath: /mnt/env
            - name: config
              mountPath: /opt/kafka/config/kraft/server.properties
              subPath: server.properties
            - name: data
              mountPath: {{ .Values.kafka.logDirs }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 60
            periodSeconds: 20

      volumes:
        - name: kafka-env
          emptyDir: {}
        - name: config
          configMap:
            name: {{ include "kafka.name" . }}-config

  # ── PVC 템플릿 (StatefulSet 전용) ────────────────────────────────────────────
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.persistence.storageClass }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}