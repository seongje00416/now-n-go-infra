name: ECS Deploy (All Services)

on:
  push:
    branches: [ecr-test]

env:
  AWS_REGION: ap-northeast-2
  ECS_CLUSTER: nowandgo-prod

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: gateway-service, path: domain/auth/gateway-service }
          - { name: user-command-service, path: domain/auth/user-command-service }
          - { name: email-service, path: domain/auth/email-service }
          - { name: user-write-service, path: data/auth/user-write-service }
          - { name: user-read-service, path: data/auth/user-read-service }
          - { name: products-create-service, path: domain/products/products-create-service }
          - { name: products-list-service, path: domain/products/products-list-service }
          - { name: products-write-service, path: data/products/products-write-service }
          - { name: products-read-service, path: data/products/products-read-service }
          - { name: cancellation-policy-data, path: data/products/cancellation-policy-data }
          - { name: reviews-create-service, path: domain/reviews/reviews-create-service }
          - { name: reviews-list-service, path: domain/reviews/reviews-list-service }
          - { name: review-write-service, path: data/reviews/review-write-service }
          - { name: review-read-service, path: data/reviews/review-read-service }
          - { name: wishlist-data, path: data/wishlists/wishlist-data }
          - { name: skus-write-service, path: data/skus/skus-write-service }
          - { name: skus-read-service, path: data/skus/skus-read-service }
          - { name: sku-flights-write-service, path: data/sku-flights/sku-flights-write-service }
          - { name: sku-flights-read-service, path: data/sku-flights/sku-flights-read-service }
          - { name: reservation-travel-service, path: domain/booking/reservation-travel-service }
          - { name: publish-order-service, path: domain/booking/publish-order-service }
          - { name: save-payments-service, path: domain/booking/save-payments-service }
          - { name: orders-write-service, path: data/orders/orders-write-service }
          - { name: orders-read-service, path: data/orders/orders-read-service }
          - { name: payments-write-service, path: data/payments/payments-write-service }
          - { name: payments-read-service, path: data/payments/payments-read-service }
          - { name: order-items-write-service, path: data/order-items/order-items-write-service }
          - { name: order-items-read-service, path: data/order-items/order-items-read-service }
          - { name: location-write-service, path: data/location/location-write-service }
          - { name: location-read-service, path: data/location/location-read-service }
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/${{ matrix.service.name }}:$IMAGE_TAG \
            -t $ECR_REGISTRY/${{ matrix.service.name }}:latest \
            -f ${{ matrix.service.path }}/Dockerfile .
          docker push $ECR_REGISTRY/${{ matrix.service.name }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ matrix.service.name }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        service:
          - gateway-service
          - user-command-service
          - email-service
          - user-write-service
          - user-read-service
          - products-create-service
          - products-list-service
          - products-write-service
          - products-read-service
          - cancellation-policy-data
          - reviews-create-service
          - reviews-list-service
          - review-write-service
          - review-read-service
          - wishlist-data
          - skus-write-service
          - skus-read-service
          - sku-flights-write-service
          - sku-flights-read-service
          - reservation-travel-service
          - publish-order-service
          - save-payments-service
          - orders-write-service
          - orders-read-service
          - payments-write-service
          - payments-read-service
          - order-items-write-service
          - order-items-read-service
          - location-write-service
          - location-read-service
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service nowandgo-${{ matrix.service }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

  # Travel AI deploy (separate — Python/FastAPI, different build)
  deploy-travel-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push travel-ai
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/travel-ai:$IMAGE_TAG \
            -t $ECR_REGISTRY/travel-ai:latest \
            -f lambda/travel-ai/Dockerfile lambda/travel-ai/
          docker push $ECR_REGISTRY/travel-ai:$IMAGE_TAG
          docker push $ECR_REGISTRY/travel-ai:latest

      - name: Deploy travel-ai to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service nowandgo-travel-ai \
            --force-new-deployment
