services:
  jenkins:
    build: .
    container_name: jenkins
    ports:
      - "8000:8080"      # Jenkins UI
      - "50000:50000"    # Agent 연결
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./casc:/var/jenkins_home/casc:ro
    group_add:
      - "999"    # 호스트 docker.sock GID에 맞춤
    environment:
      - TZ=Asia/Seoul
      - JAVA_OPTS=-Duser.timezone=Asia/Seoul
      - CASC_JENKINS_CONFIG=/var/jenkins_home/casc
      - GITHUB_USERNAME=${GITHUB_USERNAME}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_ARGO_REPO_URL=${GITHUB_ARGO_REPO_URL}
      - GITHUB_BE_REPO_URL=${GITHUB_BE_REPO_URL}
      - GITHUB_FE_REPO_URL=${GITHUB_FE_REPO_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ci-net
    restart: "no"

  registry:
    image: registry:2
    container_name: local-registry
    ports:
      - "5000:5000"
    volumes:
      - registry_data:/var/lib/registry
    networks:
      - ci-net
    restart: "no"

volumes:
  jenkins_home:
  registry_data:

networks:
  ci-net:
    driver: bridge
