apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: dev
type: Opaque
stringData:
  # Keycloak DB
  POSTGRES_USER: "keycloak"
  POSTGRES_PASSWORD: "changeme"

  # Keycloak Admin
  KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
  KC_BOOTSTRAP_ADMIN_PASSWORD: "changeme"

  # BFF Client
  KEYCLOAK_CLIENT_SECRET: "changeme"

  # Redis (auth)
  REDIS_PASSWORD: "changeme"

  # User DB
  USER_DB_USER: "userservice"
  USER_DB_PASSWORD: "changeme"

  # SMTP
  SMTP_USER: "your-email@gmail.com"
  SMTP_PASSWORD: "your-app-password"
  SMTP_FROM: "your-email@gmail.com"
  SMTP_FROM_DISPLAY_NAME: "Ticket-Service"

  # Internal API Key (서비스 간 통신)
  INTERNAL_API_KEY: "changeme"

  # Google OAuth
  GOOGLE_CLIENT_ID: "your-google-client-id"
  GOOGLE_CLIENT_SECRET: "your-google-client-secret"

  # Redis (business)
  REDIS_BUSINESS_PASSWORD: "changeme"

  # Booking DB
  BOOKING_DB_USER: "bookingservice"
  BOOKING_DB_PASSWORD: "changeme"

  # Encryption Keys (AES-256 + HMAC)
  ENCRYPTION_AES_KEY: "your-base64-aes-key"
  ENCRYPTION_HMAC_KEY: "your-base64-hmac-key"

  # S3 (MinIO)
  S3_ACCESS_KEY: "minioadmin"
  S3_SECRET_KEY: "changeme"
