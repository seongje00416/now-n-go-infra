apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-command-service
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-command-service
  template:
    metadata:
      labels:
        app: user-command-service
    spec:
      containers:
      - name: user-command-service
        image: {{ .Values.registry }}/user-command-service:{{ .Values.beImageTag }}
        imagePullPolicy: Always
        ports:
        - containerPort: 8086
        env:
        - name: JAVA_OPTS
          value: "-Xms128m -Xmx256m -XX:+UseSerialGC -XX:MaxMetaspaceSize=96m"
        - name: SPRING_PROFILES_ACTIVE
          value: "k8s"
        - name: USER_DB_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: USER_DB_HOST
        - name: USER_DB_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: USER_DB_PORT
        - name: USER_DB_USER
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: USER_DB_USER
        - name: USER_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: USER_DB_PASSWORD
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: KAFKA_BOOTSTRAP_SERVERS
        - name: KEYCLOAK_INTERNAL_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: KEYCLOAK_INTERNAL_URL
        - name: KEYCLOAK_REALM
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: KEYCLOAK_REALM
        - name: KEYCLOAK_CLIENT_ID
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: KEYCLOAK_CLIENT_ID
        - name: KEYCLOAK_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: KEYCLOAK_CLIENT_SECRET
        - name: INTERNAL_API_KEY
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: INTERNAL_API_KEY
        - name: ENCRYPTION_AES_KEY
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: ENCRYPTION_AES_KEY
        - name: ENCRYPTION_HMAC_KEY
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: ENCRYPTION_HMAC_KEY
        - name: S3_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: S3_ENDPOINT
        - name: S3_PUBLIC_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: S3_PUBLIC_ENDPOINT
        - name: S3_REGION
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: S3_REGION
        - name: S3_BUCKET
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: S3_BUCKET
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: S3_ACCESS_KEY
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: S3_SECRET_KEY
        - name: S3_TRUST_ALL_CERTS
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: S3_TRUST_ALL_CERTS
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8086
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "384Mi"
            cpu: "300m"
---
apiVersion: v1
kind: Service
metadata:
  name: user-command-service
  namespace: dev
spec:
  selector:
    app: user-command-service
  ports:
  - port: 8086
    targetPort: 8086
