apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-business
  namespace: dev
spec:
  serviceName: redis-business
  replicas: 1
  selector:
    matchLabels:
      app: redis-business
  template:
    metadata:
      labels:
        app: redis-business
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        command:
        - redis-server
        - --requirepass
        - $(REDIS_BUSINESS_PASSWORD)
        - --maxmemory
        - 256mb
        - --maxmemory-policy
        - allkeys-lru
        ports:
        - containerPort: 6379
        env:
        - name: REDIS_BUSINESS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: REDIS_BUSINESS_PASSWORD
        readinessProbe:
          exec:
            command: ["redis-cli", "-a", "$(REDIS_BUSINESS_PASSWORD)", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        volumeMounts:
        - name: data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-business
  namespace: dev
spec:
  selector:
    app: redis-business
  ports:
  - port: 6379
    targetPort: 6379
  clusterIP: None
