apiVersion: apps/v1
kind: Deployment
metadata:
  name: community-write-service
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: community-write-service
  template:
    metadata:
      labels:
        app: community-write-service
    spec:
      containers:
      - name: community-write-service
        image: {{ .Values.registry }}/community-write-service:{{ .Values.communityWriteImageTag }}
        imagePullPolicy: Always
        ports:
        - containerPort: 8192
        env:
        - name: JAVA_OPTS
          value: "-Xms128m -Xmx256m -XX:+UseSerialGC -XX:MaxMetaspaceSize=96m"
        - name: SPRING_PROFILES_ACTIVE
          value: "k8s"
        - name: BOOKING_DB_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: BOOKING_DB_HOST
        - name: BOOKING_DB_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: BOOKING_DB_PORT
        - name: BOOKING_DB_USER
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: BOOKING_DB_USER
        - name: BOOKING_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: BOOKING_DB_PASSWORD
        - name: INTERNAL_API_KEY
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: INTERNAL_API_KEY
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8192
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "320Mi"
            cpu: "300m"
---
apiVersion: v1
kind: Service
metadata:
  name: community-write-service
  namespace: dev
spec:
  selector:
    app: community-write-service
  ports:
  - port: 8192
    targetPort: 8192
