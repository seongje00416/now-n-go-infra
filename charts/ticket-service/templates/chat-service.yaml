apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
    spec:
      containers:
      - name: chat-service
        image: {{ .Values.registry }}/chat-service:{{ .Values.chatImageTag }}
        imagePullPolicy: Always
        ports:
        - containerPort: 8096
        env:
        - name: JAVA_OPTS
          value: "-Xms128m -Xmx256m -XX:+UseSerialGC -XX:MaxMetaspaceSize=96m"
        - name: SPRING_PROFILES_ACTIVE
          value: "k8s"
        - name: BOOKING_DB_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: BOOKING_DB_HOST
        - name: BOOKING_DB_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: BOOKING_DB_PORT
        - name: BOOKING_DB_USER
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: BOOKING_DB_USER
        - name: BOOKING_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: BOOKING_DB_PASSWORD
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: KAFKA_BUSINESS_BOOTSTRAP_SERVERS
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: REDIS_BUSINESS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: REDIS_BUSINESS_PORT
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: REDIS_BUSINESS_PASSWORD
        - name: INTERNAL_API_KEY
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: INTERNAL_API_KEY
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8096
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "384Mi"
            cpu: "300m"
---
apiVersion: v1
kind: Service
metadata:
  name: chat-service
  namespace: dev
spec:
  selector:
    app: chat-service
  ports:
  - port: 8096
    targetPort: 8096
