apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-query-service
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-query-service
  template:
    metadata:
      labels:
        app: user-query-service
    spec:
      containers:
      - name: user-query-service
        image: {{ .Values.registry }}/user-query-service:{{ .Values.userQueryImageTag }}
        imagePullPolicy: Always
        ports:
        - containerPort: 8087
        env:
        - name: JAVA_OPTS
          value: "-Xms128m -Xmx256m -XX:+UseSerialGC -XX:MaxMetaspaceSize=96m"
        - name: SPRING_PROFILES_ACTIVE
          value: "k8s"
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: REDIS_PORT
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: REDIS_PASSWORD
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: KAFKA_BOOTSTRAP_SERVERS
        - name: INTERNAL_API_KEY
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: INTERNAL_API_KEY
        - name: COMMAND_SERVICE_URL
          value: "http://user-command-service:8086"
        - name: S3_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: S3_ENDPOINT
        - name: S3_PUBLIC_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: S3_PUBLIC_ENDPOINT
        - name: S3_REGION
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: S3_REGION
        - name: S3_BUCKET
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: S3_BUCKET
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: S3_ACCESS_KEY
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: S3_SECRET_KEY
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8087
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "384Mi"
            cpu: "300m"
---
apiVersion: v1
kind: Service
metadata:
  name: user-query-service
  namespace: dev
spec:
  selector:
    app: user-query-service
  ports:
  - port: 8087
    targetPort: 8087
