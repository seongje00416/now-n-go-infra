# ─── MinIO TLS 자체 서명 인증서 (자동 생성) ──────────────────────────────────
{{- $existingSecret := (lookup "v1" "Secret" "dev" "minio-tls") }}
{{- if $existingSecret }}
# minio-tls secret이 이미 존재하면 기존 값 유지
apiVersion: v1
kind: Secret
metadata:
  name: minio-tls
  namespace: dev
type: Opaque
data:
  public.crt: {{ index $existingSecret.data "public.crt" }}
  private.key: {{ index $existingSecret.data "private.key" }}
{{- else }}
# 최초 설치 시 자체 서명 인증서 자동 생성
{{- $cert := genSelfSignedCert "minio" (list "127.0.0.1") (list "minio" "minio.dev.svc.cluster.local" "localhost") 3650 }}
apiVersion: v1
kind: Secret
metadata:
  name: minio-tls
  namespace: dev
type: Opaque
data:
  public.crt: {{ $cert.Cert | b64enc }}
  private.key: {{ $cert.Key | b64enc }}
{{- end }}
