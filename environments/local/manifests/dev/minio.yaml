# ─── MinIO Deployment (TLS) ──────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: minio/minio:RELEASE.2024-06-13T22-53-53Z
        command:
        - minio
        - server
        - /data
        - --console-address
        - ":9001"
        - --certs-dir
        - /certs
        ports:
        - containerPort: 9000
          name: api
        - containerPort: 9001
          name: console
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: S3_ACCESS_KEY
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: S3_SECRET_KEY
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: 9000
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /minio/health/live
            port: 9000
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 30
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        volumeMounts:
        - name: data
          mountPath: /data
        - name: certs
          mountPath: /certs
          readOnly: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: minio-data
      - name: certs
        secret:
          secretName: minio-tls
          items:
          - key: public.crt
            path: public.crt
          - key: private.key
            path: private.key
---
# ─── MinIO Service (NodePort) ────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: dev
spec:
  type: NodePort
  selector:
    app: minio
  ports:
  - name: api
    port: 9000
    targetPort: 9000
    nodePort: 30100
  - name: console
    port: 9001
    targetPort: 9001
    nodePort: 30101
---
# ─── 기본 버킷 생성 Job ─────────────────────────────────────────────────────
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-bucket
  namespace: dev
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-minio
        image: busybox:1.36
        command:
        - sh
        - -c
        - 'until wget --no-check-certificate -qO- https://minio:9000/minio/health/ready; do echo "waiting for minio..."; sleep 3; done'
      containers:
      - name: mc
        image: minio/mc:RELEASE.2024-06-12T14-34-03Z
        command:
        - /bin/sh
        - -c
        - |
          mc alias set local https://minio:9000 $S3_ACCESS_KEY $S3_SECRET_KEY --insecure &&
          mc mb --ignore-existing local/user-profiles --insecure &&
          echo "Bucket 'user-profiles' created successfully"
        env:
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: S3_ACCESS_KEY
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: S3_SECRET_KEY
---
# ─── MinIO PVC ────────────────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: dev
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
