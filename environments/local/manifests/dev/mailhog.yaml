apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailhog
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailhog
  template:
    metadata:
      labels:
        app: mailhog
    spec:
      containers:
      - name: mailhog
        image: axllent/mailpit:v1.29.3
        ports:
        - containerPort: 1025  # SMTP
          name: smtp
        - containerPort: 8025  # Web UI
          name: http
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: mailhog
  namespace: dev
spec:
  type: NodePort
  selector:
    app: mailhog
  ports:
  - name: smtp
    port: 1025
    targetPort: 1025
    nodePort: 30026
    protocol: TCP
  - name: http
    port: 8025
    targetPort: 8025
    nodePort: 30025
    protocol: TCP
