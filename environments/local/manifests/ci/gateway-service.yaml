apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
      - name: gateway-service
        image: localhost:5000/gateway-service:15
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: JAVA_OPTS
          value: "-Xms128m -Xmx256m -XX:+UseSerialGC -XX:MaxMetaspaceSize=96m"
        - name: SPRING_PROFILES_ACTIVE
          value: "k8s"
        - name: KEYCLOAK_INTERNAL_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: KEYCLOAK_INTERNAL_URL
        - name: KEYCLOAK_EXTERNAL_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: KEYCLOAK_EXTERNAL_URL
        - name: KEYCLOAK_REALM
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: KEYCLOAK_REALM
        - name: KEYCLOAK_CLIENT_ID
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: KEYCLOAK_CLIENT_ID
        - name: KEYCLOAK_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: KEYCLOAK_CLIENT_SECRET
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: KAFKA_BOOTSTRAP_SERVERS
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: REDIS_PORT
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: REDIS_PASSWORD
        - name: INTERNAL_API_KEY
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: INTERNAL_API_KEY
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: GOOGLE_CLIENT_ID
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: GOOGLE_CLIENT_SECRET
        - name: SOCIAL_LOGIN_SUCCESS_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: SOCIAL_LOGIN_SUCCESS_URL
        - name: SOCIAL_LOGIN_ERROR_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: SOCIAL_LOGIN_ERROR_URL
        - name: SOCIAL_CALLBACK_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: SOCIAL_CALLBACK_BASE_URL
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "384Mi"
            cpu: "300m"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: dev
spec:
  type: NodePort
  selector:
    app: gateway-service
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
